name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Reproducible install straight from the committed lockfile.
      - name: Install dependencies
        run: npm ci

      - name: TypeScript checks
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build web app (Vite)
        run: npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      # Deterministic Android SDK setup for GitHub-hosted runners. Installs the
      # exact platform/build-tools versions without interactive prompts.
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build debug APK (Gradle)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists and is non-empty
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK not found at $APK"
            exit 1
          fi
          if [ ! -s "$APK" ]; then
            echo "::error::APK at $APK is empty"
            exit 1
          fi
          echo "APK produced:"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PennyTrack-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
